# Fox from the Khronos glTF sample assets (see LICENSE.md): low-poly, one
# texture, 24 joints, three clips. A good test of skinning and styles.
name = "Fox"
model = "Fox.glb"
# Three-quarter view reads better than head-on.
facing = 35
height = 260
style = "real"

[animations]
idle = "Survey"
fidget = ["Walk"]
react = "Run"

[rig]
head = "b_Head_05"
look_limit = 30


[styles.real]
kind = "real"
fur = 0.014
glow = [1.0, 0.85, 0.7]

[styles.anime]
kind = "anime"
outline = 0.006
bands = 2
glow = [1.0, 0.9, 0.8]

[styles.cyber]
kind = "cyber"
outline = 0.004
glow = [0.25, 0.95, 1.0]
